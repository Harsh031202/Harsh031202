<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264" width="1200" height="264" role="img" aria-labelledby="ed-title ed-desc">
  <title id="ed-title">Education</title>
  <desc id="ed-desc">B.Tech at Birsa Institute of Technology Sindri (2022 to 2026), Intermediate at D.A.V. Public School Cantt Area (2019 to 2021), Matriculation at D.A.V. Public School Manpur (2011 to 2019).</desc>
  <defs>
    <linearGradient id="ed-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1A38"/><stop offset="1" stop-color="#061024"/></linearGradient>
    <radialGradient id="ed-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#1E4A8A" stop-opacity=".9"/><stop offset="1" stop-color="#1E4A8A" stop-opacity="0"/></radialGradient>
    <radialGradient id="ed-pulse"><stop offset="0" stop-color="#EEF5FF"/><stop offset=".5" stop-color="#A9CDF5" stop-opacity=".6"/><stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ed-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF5FF"/><stop offset=".45" stop-color="#A9CDF5"/><stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ed-panel { animation: ed-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .ed-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: ed-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    .ed-trace { stroke-dasharray: 180 820; stroke-dashoffset: 1000; animation: ed-trace 7s linear infinite; }
    @keyframes ed-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes ed-draw { to { stroke-dashoffset: 0; } }
    @keyframes ed-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ed-panel { animation: none; } .ed-web { animation: none; stroke-dashoffset: 0; } .ed-trace { display: none; } }
  </style>
  <rect width="1200" height="264" rx="20" fill="url(#ed-bg)"/>
  <rect width="1200" height="264" rx="20" fill="url(#ed-glow)"/>
  <rect x=".5" y=".5" width="1199" height="263" rx="19.5" fill="none" stroke="#6FA8E8" stroke-opacity=".16"/>
  <path class="ed-web" d="M24 132 H1176" fill="none" stroke="#6FA8E8" stroke-opacity=".22"/>
  <circle cx="0" cy="132" r="8" fill="url(#ed-pulse)" opacity="0">
    <animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#061024" stroke="#A9CDF5">
    <rect x="400" y="126" width="12" height="12" transform="rotate(45 406 132)"/>
    <rect x="788" y="126" width="12" height="12" transform="rotate(45 794 132)"/>
  </g>
  <g class="ed-panel" style="animation-delay:0.05s"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#0A1A38" fill-opacity=".85" stroke="#6FA8E8" stroke-opacity=".22"/>
    <rect class="ed-trace" pathLength="1000" style="animation-delay:-0.00s" width="360" height="200" rx="14" fill="none" stroke="url(#ed-trace)" stroke-width="1.4" stroke-linecap="round"/>
    
    <text class="ed-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#6FA8E8">01  MATRICULATION</text>
    <text class="ed-serif" x="24" y="92" font-size="28" font-weight="300" fill="#EEF5FF">D.A.V. Public School</text>
    <text class="ed-serif" x="24" y="126" font-size="26" font-weight="300" fill="#9BB3D4">Manpur</text>
    <text class="ed-mono" x="24" y="186" font-size="10.5" letter-spacing="1.6" fill="#9BB3D4">APR 2011 — FEB 2019</text>
  </g></g>
  <g class="ed-panel" style="animation-delay:0.20s"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#0A1A38" fill-opacity=".85" stroke="#6FA8E8" stroke-opacity=".22"/>
    <rect class="ed-trace" pathLength="1000" style="animation-delay:-0.90s" width="360" height="200" rx="14" fill="none" stroke="url(#ed-trace)" stroke-width="1.4" stroke-linecap="round"/>
    
    <text class="ed-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#6FA8E8">02  INTERMEDIATE</text>
    <text class="ed-serif" x="24" y="92" font-size="28" font-weight="300" fill="#EEF5FF">D.A.V. Public School</text>
    <text class="ed-serif" x="24" y="126" font-size="26" font-weight="300" fill="#9BB3D4">Cantt Area</text>
    <text class="ed-mono" x="24" y="186" font-size="10.5" letter-spacing="1.6" fill="#9BB3D4">APR 2019 — MAY 2021</text>
  </g></g>
  <g class="ed-panel" style="animation-delay:0.35s"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#0A1A38" fill-opacity=".85" stroke="#6FA8E8" stroke-opacity=".45"/>
    <rect class="ed-trace" pathLength="1000" style="animation-delay:-1.80s" width="360" height="200" rx="14" fill="none" stroke="url(#ed-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="0" y="0" width="3" height="200" rx="1.5" fill="#6FA8E8"/>
    <text class="ed-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#6FA8E8">03  B.TECH.</text>
    <text class="ed-serif" x="24" y="92" font-size="28" font-weight="300" fill="#EEF5FF">Birsa Institute of</text>
    <text class="ed-serif" x="24" y="126" font-size="28" font-weight="300" fill="#EEF5FF">Technology Sindri</text>
    <text class="ed-serif" x="24" y="160" font-size="22" font-weight="300" fill="#9BB3D4">BIT Sindri</text>
    <text class="ed-mono" x="24" y="186" font-size="10.5" letter-spacing="1.6" fill="#9BB3D4">NOV 2022 — AUG 2026</text>
  </g></g>
</svg>
