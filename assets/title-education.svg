<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="05 Education: Where I learned.">
  <defs>
    <linearGradient id="te-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#6FA8E8"/><stop offset=".6" stop-color="#2F6FC0"/><stop offset="1" stop-color="#2F6FC0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="te-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#A9CDF5"/><stop offset=".5" stop-color="#EEF5FF"/><stop offset="1" stop-color="#A9CDF5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="te-pulse"><stop offset="0" stop-color="#EEF5FF"/><stop offset=".5" stop-color="#A9CDF5" stop-opacity=".6"/><stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .te-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .te-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .te-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .te-in { animation: te-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .te-d2 { animation-delay: .2s; } .te-d3 { animation-delay: .45s; }
    .te-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: te-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes te-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes te-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .te-in { animation: none; } .te-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="te-in">
    <text class="te-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#6FA8E8"><tspan fill="#A9CDF5">05</tspan>   EDUCATION</text>
  </g>
  <g class="te-in te-d2">
    <text class="te-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#EEF5FF">Where I <tspan font-style="italic" fill="url(#te-sheen)">learned.</tspan></text>
  </g>
  <g class="te-in te-d3">
    <text class="te-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#9BB3D4">B.TECH · INTERMEDIATE · MATRICULATION</text>
  </g>
  <path class="te-draw" d="M40 106 H1160" stroke="url(#te-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#te-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
