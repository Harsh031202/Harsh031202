<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">DarK — a coder that likes to innovate.</title>
  <desc id="hero-desc">DarK (Harsh Kumar Harsh): coder who builds web apps, Chrome extensions and ML projects in Python and TypeScript.</desc>

  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%">
      <stop offset="0" stop-color="#0C1F44"/>
      <stop offset=".55" stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#061024"/>
    </radialGradient>
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2F6FC0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2F6FC0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6FA8E8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#EEF5FF"/>
      <stop offset=".55" stop-color="#A9CDF5"/>
      <stop offset="1" stop-color="#6FA8E8"/>
    </linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#EEF5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#EEF5FF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;760 0;760 0" keyTimes="0;.35;1" dur="8s" begin="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9CDF5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9CDF5" stop-opacity=".07"/>
      <stop offset="1" stop-color="#A9CDF5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA8E8" stop-opacity="0"/>
      <stop offset=".2" stop-color="#A9CDF5"/>
      <stop offset=".75" stop-color="#2F6FC0"/>
      <stop offset="1" stop-color="#2F6FC0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-orbit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9CDF5" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2F6FC0" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6FA8E8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="hero-grid-fade" cx="68%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="hero-grid-mask">
      <rect width="1200" height="480" fill="url(#hero-grid-fade)"/>
    </mask>
    <filter id="hero-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="hero-arch"><path d="M847 380 V202 A118 118 0 0 1 1083 202 V380 Z"/></clipPath>
    <radialGradient id="hero-photo-wash" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0E2142"/><stop offset="1" stop-color="#061024"/>
    </radialGradient>
    <radialGradient id="moon-body" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#EEF5FF"/><stop offset=".45" stop-color="#8FB4E8"/><stop offset=".8" stop-color="#2F6FC0"/><stop offset="1" stop-color="#1B3A6E"/>
    </radialGradient>
    <radialGradient id="moon-shade" cx="30%" cy="28%" r="85%">
      <stop offset=".35" stop-color="#061024" stop-opacity="0"/><stop offset="1" stop-color="#061024" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset=".6" stop-color="#A9CDF5" stop-opacity=".22"/><stop offset="1" stop-color="#A9CDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-photo-grade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#102650" stop-opacity="0"/>
      <stop offset=".85" stop-color="#102650" stop-opacity=".45"/>
      <stop offset="1" stop-color="#061024" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="hero-photo-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-frame-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9CDF5"/>
      <stop offset=".5" stop-color="#2F6FC0"/>
      <stop offset="1" stop-color="#CFE3FF"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>

  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .hero-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .hero-rise { animation: hero-rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .hero-fade { animation: hero-fade 1.6s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .9s; } .d5 { animation-delay: 1.2s; } .d6 { animation-delay: 1.5s; }

    .hero-draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.4s cubic-bezier(.65,0,.35,1) .9s forwards; }
    .hero-signal { stroke-dasharray: 500; stroke-dashoffset: 500; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 2.2s forwards; }

    .hero-portrait { animation: hero-photo 1.6s cubic-bezier(.16,1,.3,1) .5s both; }
    .hero-frame { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes hero-photo { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes hero-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }

    /* Static, fully visible composition for anyone who prefers no motion */
    @media (prefers-reduced-motion: reduce) {
      .hero-rise, .hero-fade, .hero-portrait { animation: none; }
      .hero-frame { animation: none; stroke-dashoffset: 0; }
      .hero-draw, .hero-signal { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- Canvas -->
    <rect width="1200" height="480" fill="url(#hero-bg)"/>

    <!-- Slow light fields -->
    <ellipse cx="900" cy="140" rx="420" ry="300" fill="url(#hero-light-a)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <ellipse cx="180" cy="460" rx="360" ry="220" fill="url(#hero-light-b)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 -25; 0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>

    <!-- Technical grid -->
    <rect width="1200" height="480" fill="url(#hero-grid)" mask="url(#hero-grid-mask)"/>

    <!-- Slow scan line across the grid -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hero-scan)">
      <animate attributeName="y" values="-140;480" dur="11s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Drifting particles -->
    <g fill="#A9CDF5">
      <circle cx="560" cy="120" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="120;96" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.1"><animate attributeName="opacity" values="0;.8;0" dur="5.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;48" dur="5.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="380" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="380;352" dur="4.8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="420" r="1.2"><animate attributeName="opacity" values="0;.7;0" dur="6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="420;396" dur="6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="60" r="1.3"><animate attributeName="opacity" values="0;.85;0" dur="5s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="60;40" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="250" r="1"><animate attributeName="opacity" values="0;.7;0" dur="4.4s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="250;226" dur="4.4s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Orbital system, now circling the portrait -->
    <g transform="translate(965 232)" class="hero-fade d3">
      <circle r="212" fill="none" stroke="#6FA8E8" stroke-opacity=".1" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="140s" repeatCount="indefinite"/>
      </circle>
      <circle r="190" fill="none" stroke="url(#hero-orbit-grad)" stroke-width="1"/>
      <circle r="160" fill="none" stroke="#6FA8E8" stroke-opacity=".16" stroke-dasharray="2 7"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="95s" repeatCount="indefinite"/>
        <circle cx="0" cy="160" r="2.5" fill="#EEF5FF"/>
        <circle cx="-160" cy="0" r="2" fill="#6FA8E8" fill-opacity=".7"/>
      </g>
    </g>

    <!-- Portrait -->
    <g class="hero-portrait">
      <path d="M835 392 V202 A130 130 0 0 1 1095 202 V392 Z" fill="none" stroke="#6FA8E8" stroke-opacity=".25">
        <animate attributeName="stroke-opacity" values=".15;.5;.15" dur="5s" repeatCount="indefinite"/>
      </path>
      <g clip-path="url(#hero-arch)">
        <rect x="847" y="84" width="236" height="296" fill="url(#hero-photo-wash)"/>
        <circle cx="868" cy="110" r="1.2" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="1058" cy="128" r="1" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="884" cy="330" r="1.1" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="1050" cy="320" r="1.3" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="902" cy="156" r="0.9" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="1032" cy="98" r="1.1" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="2.0s" repeatCount="indefinite"/></circle><circle cx="872" cy="250" r="0.8" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="1070" cy="230" r="1" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="6s" begin="2.8s" repeatCount="indefinite"/></circle><circle cx="940" cy="360" r="1" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="3.2s" repeatCount="indefinite"/></circle><circle cx="1010" cy="352" r="0.9" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="3.6s" repeatCount="indefinite"/></circle><circle cx="920" cy="96" r="0.9" fill="#EEF5FF"><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin="4.0s" repeatCount="indefinite"/></circle>
        <circle cx="965" cy="232" r="118" fill="url(#moon-halo)"/>
        <g transform="translate(965 232)">
          <circle r="86" fill="url(#moon-body)"/>
          <circle cx="-30" cy="-38" r="17" fill="#1B3A6E" fill-opacity=".55"/><circle cx="-31" cy="-39" r="17" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="22" cy="-52" r="9" fill="#1B3A6E" fill-opacity=".55"/><circle cx="21" cy="-53" r="9" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="46" cy="-14" r="13" fill="#1B3A6E" fill-opacity=".55"/><circle cx="45" cy="-15" r="13" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="-52" cy="6" r="10" fill="#1B3A6E" fill-opacity=".55"/><circle cx="-53" cy="5" r="10" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="-8" cy="10" r="22" fill="#1B3A6E" fill-opacity=".55"/><circle cx="-9" cy="9" r="22" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="30" cy="40" r="12" fill="#1B3A6E" fill-opacity=".55"/><circle cx="29" cy="39" r="12" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="-38" cy="52" r="8" fill="#1B3A6E" fill-opacity=".55"/><circle cx="-39" cy="51" r="8" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="8" cy="66" r="7" fill="#1B3A6E" fill-opacity=".55"/><circle cx="7" cy="65" r="7" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/><circle cx="58" cy="30" r="6" fill="#1B3A6E" fill-opacity=".55"/><circle cx="57" cy="29" r="6" fill="none" stroke="#EEF5FF" stroke-opacity=".25"/>
          <circle r="86" fill="url(#moon-shade)"/>
        </g>
        <ellipse cx="965" cy="232" rx="128" ry="26" fill="none" stroke="#A9CDF5" stroke-opacity=".5" transform="rotate(-18 965 232)"/>
        <rect x="847" y="84" width="236" height="296" fill="url(#hero-photo-grade)"/>
        <rect x="700" y="84" width="90" height="296" fill="url(#hero-photo-sheen)" transform="skewX(-14)">
          <animate attributeName="x" values="700;1260;1260" keyTimes="0;.3;1" dur="9s" begin="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <path class="hero-frame" d="M847 380 V202 A118 118 0 0 1 1083 202 V380 Z" fill="none" stroke="url(#hero-frame-grad)" stroke-width="1.5"/>
      <path d="M829 290 v-22 h22" fill="none" stroke="#A9CDF5" stroke-opacity=".8"/>
      <path d="M1101 398 v-22 M1101 398 h-22" fill="none" stroke="#A9CDF5" stroke-opacity=".8"/>
    </g>

    <g transform="translate(965 232)" class="hero-fade d4">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
        <circle cx="190" cy="0" r="3.5" fill="#A9CDF5" filter="url(#hero-glow)"/>
        <circle cx="-134" cy="-134" r="2" fill="#6FA8E8"/>
      </g>
      <!-- Node labels: the layers I work across -->
      <g class="hero-mono" font-size="10.5" letter-spacing="1.6" fill="#9BB3D4">
        <g transform="translate(-118 -152)"><circle r="3" fill="#6FA8E8"/><text x="10" y="4">ML</text></g>
        <g transform="translate(150 -96)"><circle r="3" fill="#6FA8E8"/><text x="10" y="4">API</text></g>
        <g transform="translate(150 110)"><circle r="3" fill="#6FA8E8"/><text x="10" y="4">DATA</text></g>
        <g transform="translate(-158 40)"><circle r="3" fill="#6FA8E8"/><text x="-14" y="4" text-anchor="end">UI</text></g>
      </g>
    </g>

    <!-- Signal path drawing itself through the composition -->
    <path class="hero-signal" d="M600 342 C 680 338, 740 330, 780 318 S 828 300, 847 300" fill="none" stroke="#6FA8E8" stroke-opacity=".5" stroke-width="1.2"/>
    <circle cx="600" cy="342" r="3" fill="#EEF5FF" filter="url(#hero-glow)" opacity=".9">
      <animateMotion dur="5s" repeatCount="indefinite" begin="4.4s" path="M600 342 C 680 338, 740 330, 780 318 S 828 300, 847 300" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/>
    </circle>

    <!-- Terminal indicator -->
    <g class="hero-fade d1" transform="translate(72 64)">
      <rect width="322" height="34" rx="17" fill="#0A1A38" stroke="#6FA8E8" stroke-opacity=".25"/>
      <circle cx="20" cy="17" r="4" fill="#6FA8E8">
        <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text class="hero-mono" x="34" y="21.5" font-size="12" fill="#9BB3D4">~/dark<tspan fill="#6FA8E8"> $ </tspan><tspan fill="#EEF5FF">build --universe</tspan></text>
      <rect x="300" y="10" width="7" height="14" fill="#A9CDF5">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Eyebrow -->
    <g class="hero-rise d2">
      <line x1="72" y1="136" x2="104" y2="136" stroke="#6FA8E8"/>
      <text class="hero-mono" x="116" y="140" font-size="12.5" letter-spacing="3.4" fill="#6FA8E8">A CODER THAT LIKES TO INNOVATE</text>
    </g>

    <!-- Name -->
    <text class="hero-serif hero-rise d3" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="#EEF5FF">Harsh Kumar</text>
    <text class="hero-serif hero-rise d4" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-name-grad)">Harsh<tspan fill="#6FA8E8">.</tspan></text>

    <!-- Light sweeping across the name -->
    <g class="hero-fade d6" pointer-events="none">
      <text class="hero-serif" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Harsh Kumar</text>
      <text class="hero-serif" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Harsh.</text>
    </g>

    <!-- Glowing underline -->
    <path class="hero-draw" d="M72 346 C 220 340, 420 352, 600 342" fill="none" stroke="url(#hero-rule)" stroke-width="2" stroke-linecap="round" filter="url(#hero-glow)"/>

    <!-- Positioning -->
    <text class="hero-mono hero-rise d5" x="72" y="384" font-size="13" letter-spacing="2.6" fill="#EEF5FF">AKA DARK  ·  WEB APPS  ·  EXTENSIONS  ·  ML</text>
    <text class="hero-serif hero-rise d6" x="72" y="420" font-size="19" font-style="italic" fill="#9BB3D4">Python, TypeScript and a lot of curiosity.</text>

    <!-- Meta strip -->
    <g class="hero-fade d6">
      <line x1="72" y1="446" x2="1128" y2="446" stroke="#6FA8E8" stroke-opacity=".14"/>
      <text class="hero-mono" x="72" y="466" font-size="10.5" letter-spacing="2" fill="#9BB3D4">BIT SINDRI · SINDRI, DHANBAD</text>
      <text class="hero-mono" x="1128" y="466" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#A9CDF5">11 PUBLIC REPOS · PULL SHARK · GITHUB PRO</text>
    </g>

    <!-- Frame -->
    <rect x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#6FA8E8" stroke-opacity=".18"/>
  </g>
</svg>
