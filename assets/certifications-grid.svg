<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-labelledby="ce-title ce-desc">
  <title id="ce-title">Certifications</title>
  <desc id="ce-desc">Eleven certifications: Google Cloud Gemini at Work, Introduction to Large Language Models, Introduction to Artificial Intelligence, What Is Generative AI, Generative AI online search, Ethics in the Age of Generative AI, two Microsoft Copilot courses, Python Fundamentals, ALPHA DSA and Java, and the Tata Imagination Challenge 2024.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1A38"/><stop offset="1" stop-color="#061024"/></linearGradient>
    <radialGradient id="ce-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#1E4A8A" stop-opacity=".9"/><stop offset="1" stop-color="#1E4A8A" stop-opacity="0"/></radialGradient>
    <radialGradient id="ce-pulse"><stop offset="0" stop-color="#EEF5FF"/><stop offset=".5" stop-color="#A9CDF5" stop-opacity=".6"/><stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF5FF"/><stop offset=".45" stop-color="#A9CDF5"/><stop offset="1" stop-color="#6FA8E8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-panel { animation: ce-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .ce-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: ce-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    .ce-trace { stroke-dasharray: 180 820; stroke-dashoffset: 1000; animation: ce-trace 7s linear infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes ce-draw { to { stroke-dashoffset: 0; } }
    @keyframes ce-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-panel { animation: none; } .ce-web { animation: none; stroke-dashoffset: 0; } .ce-trace { display: none; } }
  </style>
